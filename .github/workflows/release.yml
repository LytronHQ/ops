name: release

# A tag is the unit of distribution: it publishes every script as a release
# asset alongside a SHA256SUMS that ops-get verifies against. Nothing is
# consumable from a branch on purpose — a consumer pins a version or does not
# run at all.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every script parses
        run: |
          fail=0
          for f in $(find . -name '*.sh' -not -path './.git/*') ops-get; do
            sh -n "$f" 2>/dev/null || bash -n "$f" || { echo "::error::$f does not parse"; fail=1; }
          done
          exit $fail

      - name: Run the test suites
        run: ./run-tests

      - name: Collect assets and checksum them
        run: |
          mkdir -p dist
          # Flat asset names: a consumer asks for `harden.sh`, not a path.
          # Every module folder, discovered — adding a module needs no change here.
          # Tests and their stubs are for working on the repo, never assets.
          find . -mindepth 2 -name '*.sh' -not -path './.git/*' -not -path './dist/*' -not -path '*/tests/*' -exec cp {} dist/ \;
          cp ops-get dist/
          # Flat assets, so a duplicate filename across modules would silently
          # overwrite one of them. Refuse instead.
          dupes="$(find . -mindepth 2 -name '*.sh' -not -path './.git/*' -not -path './dist/*' -not -path '*/tests/*' -printf '%f\n' | sort | uniq -d)"
          [ -z "$dupes" ] || { echo "::error::duplicate script names across modules: $dupes"; exit 1; }
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
