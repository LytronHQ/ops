name: release

# A tag is the unit of distribution: it publishes every script as a release
# asset alongside MANIFEST and the SHA256SUMS that ops-get verifies against.
# Nothing is consumable from a branch on purpose — a consumer pins a version or
# does not run at all.
#
# The assets are built by ./build-release, the same script a person runs when
# Actions is unavailable, so there is one set of release rules, not two.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the test suites
        run: ./run-tests

      - name: Build the assets
        run: ./build-release --out dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
