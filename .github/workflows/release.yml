name: release

# A tag is the unit of distribution: it publishes every script as a release
# asset alongside MANIFEST and the SHA256SUMS that ops-get verifies against.
# Nothing is consumable from a branch on purpose — a consumer pins a version or
# does not run at all.
#
# The assets are built by ./build-release, the same script a person runs when
# Actions is unavailable, so there is one set of release rules, not two.
on:
  push:
    tags: ['v*']

# Read-only by default; only the release job may write, and every action is
# pinned to a commit: a moved tag on a third-party action would otherwise run
# with the token that publishes the SHA256SUMS ops-get trusts (LytronHQ/ops#99).
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run the test suites
        run: ./run-tests

      - name: Build the assets
        run: ./build-release --out dist

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
