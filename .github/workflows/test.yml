name: test

# The same suites a developer runs with ./run-tests, on every PR and on main, so
# a change to a script cannot merge while its tests fail.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every script parses
        run: |
          fail=0
          for f in $(find . -name '*.sh' -not -path './.git/*') ops-get run-tests build-release; do
            sh -n "$f" 2>/dev/null || bash -n "$f" || { echo "::error::$f does not parse"; fail=1; }
          done
          exit $fail

      - name: Run the test suites
        run: ./run-tests

  # The PowerShell suites on a real Windows, under both engines: Windows
  # PowerShell 5.1, the one every Windows has, and PowerShell 7. A suite exiting
  # 77 does not apply to this platform and is reported, not counted.
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: Run the PowerShell suites
        run: |
          $engine = (Get-Process -Id $PID).Path
          "engine: $engine, PowerShell $($PSVersionTable.PSVersion) $($PSVersionTable.PSEdition)"
          $failed = @()
          foreach ($t in Get-ChildItem -Recurse -Filter *_test.ps1) {
            $rel = Resolve-Path -Relative $t.FullName
            & $engine -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $t.FullName *> "$env:RUNNER_TEMP\out.txt"
            $code = $LASTEXITCODE
            if ($code -eq 0) { "{0,-44} ok" -f $rel }
            elseif ($code -eq 77) { "{0,-44} skipped ({1})" -f $rel, (Get-Content "$env:RUNNER_TEMP\out.txt" | Select-Object -Last 1) }
            else { "{0,-44} FAIL" -f $rel; Get-Content "$env:RUNNER_TEMP\out.txt" | ForEach-Object { "    $_" }; $failed += $rel }
          }
          if ($failed) { "failed: $failed"; exit 1 }
